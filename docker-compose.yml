services:
  api1:
    image: rinha-backend-2026:latest
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 285M

  api2:
    image: rinha-backend-2026:latest
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 285M

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9999:80"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 30M
